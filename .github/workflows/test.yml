name: Python checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile deploy.py poll-tunnel/backend.py shared-hosting/passenger_wsgi.py
      - run: python -m unittest discover -s tests -v
