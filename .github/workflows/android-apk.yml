name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android-client/**', '.github/workflows/android-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'ndk;25.1.8937393' 'cmake;3.22.1'
      - run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/heiher/hev-socks5-tunnel.git ../hev-socks5-tunnel
      - run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: metadmin-relay-debug-apk
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
